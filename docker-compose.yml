services:
  qwen38-flash-next:
    build: .
    image: haloq38flash:latest
    container_name: qwen38-flash-next
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    volumes:
      - /mnt/ssd2/models/qwen38-flash-next:/models:ro
    ports:
      - "${PORT:-8089}:8080"
    cpuset: "0-7"
    environment:
      - LD_LIBRARY_PATH=/app
      - RADV_PERFTEST=unified_heap
      - GGML_VK_MAX_MB_PER_SUBMIT=2048
      - GGML_VK_MMID_ROWLISTS=1
      - GGML_VK_MMID_SMALLN=1
      - GGML_VK_MMID_BM64=1
      - GGML_VK_MMID_WAVE32=1
      - GGML_VK_MMID_F16B=1
      - GGML_VK_MMID_M128=1
      - GGML_VK_FA_WAVE32=0
      - OMP_PROC_BIND=close
      - OMP_PLACES=cores
    # override CMD to change context, quant, or add mtp:
    # docker compose run qwen38-flash-next \
    #   /app/llama-server -m /models/Qwen3.8-Flash-Next-IQ4_XS-PLE.gguf \
    #   -c 257024 -ub 2048 -b 4096 -lm mmap -lzm on \
    #   -md /models/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf \
    #   --spec-type draft-mtp --spec-draft-n-max 6 --spec-draft-p-min 0.75 \
    #   --cache-ram 8192 --ctx-checkpoints 32 --cache-prompt
